# Site Settings
title: "Kamalakar Peta | Staff Data Engineer · Modern Data Stack (Databricks · dbt · Airflow)"
description: "Staff-level Data Engineer — 11+ years building large-scale, governed data pipelines on Databricks, dbt, Airflow, PySpark and SQL for analytics and data-science teams."
url: "https://kamalakarpeta.github.io"
baseurl: ""
author: "Kamalakar Peta"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  gallery:
    output: true
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .vscode
