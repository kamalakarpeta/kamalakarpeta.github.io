# Site Settings
title: "Kamalakar Peta | Data & AI Platform Architect"
description: "Data & AI Platform Architect specializing in Databricks Lakehouse, GenAI & Microsoft Fabric"
url: "https://kamalakarpeta.github.io"
baseurl: ""
author: "Kamalakar Peta"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  gallery:
    output: true
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .vscode
